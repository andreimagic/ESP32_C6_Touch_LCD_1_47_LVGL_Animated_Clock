# .github/workflows/build.yml
#
# Stage 1 — compile validation.
# Proves the sketch builds against a pinned toolchain and fits the APP partition
# on every supported board.
#
# ── Where the board targets live ─────────────────────────────────────────────
# The matrix is NOT defined here. It is read from `.github/board-targets.json`,
# which is the single source of truth shared with release.yml — so a target can
# never be validated by CI and then released with different settings, and adding
# a board is one JSON object rather than an edit in two workflows.
#
# Each entry carries its own library pins and its own flash/partition choice,
# because those are per-board properties: a 4MB variant cannot use
# PartitionScheme=default_8MB, and the S3 needs menu options the C6 has no
# equivalent for.
#
# ── What the FQBN options mean, and the traps ────────────────────────────────
# Both FQBNs mirror the mandatory IDE settings documented in the README, so a
# local Arduino IDE build and a CI build produce the same binary. Every option
# is validated against boards.txt for the pinned core version.
#
# ESP32-C6:
#   USB CDC On Boot = Enabled      -> CDCOnBoot=cdc
#   Flash Size      = 8MB (64Mb)   -> FlashSize=8M
#   Partition       = 8M w/ spiffs -> PartitionScheme=default_8MB  (3MB APP)
#   CPU 160MHz / QIO / 80MHz / JTAG Disabled / Zigbee Disabled
#
# ESP32-S3 — three traps, all of which change the produced binary:
#   * USBMode=default is USB-OTG (TinyUSB), NOT hwcdc. Waveshare's setup page
#     pictures "Hardware CDC and JTAG", but the working board is on USB-OTG.
#     USBMode sets build.usb_mode, so the two are genuinely different firmware.
#   * PSRAM=opi is load-bearing. The GIF canvas is allocated from
#     MALLOC_CAP_8BIT, which only includes the 8MB PSRAM when it is enabled;
#     without it the S3 has less headroom than the C6.
#   * esp32s3 has no FlashFreq menu — it is folded into the FlashMode label
#     (qio = "QIO 80MHz"), so unlike the C6 there is no FlashFreq= key to pin.
#
# DebugLevel is build-affecting (sets CORE_DEBUG_LEVEL). The README doesn't
# mention it, so the IDE default 'none' is what everyone builds with -- pinned
# so the two can't drift apart silently.
#
# FastIMU is pinned for both boards even though the S3 has no IMU: the header is
# included unconditionally and the tilt paths are disabled at runtime.

name: Build

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    name: Load board targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read board-targets.json
        id: load
        run: |
          set -euo pipefail
          FILE=".github/board-targets.json"
          # Fail loudly here rather than producing an empty matrix, which would
          # silently skip every build and let a broken PR report success.
          jq -e 'type == "array" and length > 0' "$FILE" > /dev/null \
            || { echo "::error::$FILE must be a non-empty JSON array"; exit 1; }
          jq -e 'all(has("name") and has("slug") and has("chip") and has("fqbn"))' "$FILE" > /dev/null \
            || { echo "::error::every entry needs name, slug, chip and fqbn"; exit 1; }
          echo "matrix=$(jq -c . "$FILE")" >> "$GITHUB_OUTPUT"
          echo "Targets: $(jq -r 'map(.name) | join(", ")' "$FILE")" >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: ${{ matrix.name }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      # Checkout lands the repo at .../<repo-name>/, which matches the .ino
      # filename — so arduino-cli accepts it as a sketch folder unmodified.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        uses: ./.github/actions/arduino-build
        with:
          fqbn: ${{ matrix.fqbn }}
          core-version: ${{ matrix.core-version }}
          lvgl-version: ${{ matrix.lvgl-version }}
          gfx-version: ${{ matrix.gfx-version }}
          fastimu-version: ${{ matrix.fastimu-version }}
          output-dir: build-out

      - name: Report size
        if: always() && hashFiles('compile.log') != ''
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo '```'
            grep -E "of (program storage space|dynamic memory)" compile.log || echo "no size data"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.slug }}-${{ github.sha }}
          path: |
            build-out/*.bin
            build-out/*.elf
            build-out/*.map
          retention-days: 14
          if-no-files-found: error

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compile-log-${{ matrix.slug }}
          path: compile.log
          retention-days: 7
