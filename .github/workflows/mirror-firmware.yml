name: Mirror firmware for web flasher

# GitHub's release-asset download URLs (github.com/.../releases/download/...
# and the release-assets.githubusercontent.com redirect behind it) don't send
# Access-Control-Allow-Origin, so the browser flasher on GitHub Pages can't
# fetch them directly. This copies each release's *-full.bin into docs/firmware/,
# which Pages serves same-origin (no CORS involved at all).
#
# main has branch protection requiring PRs, so this opens/updates a PR rather
# than pushing directly. Re-running for the same channel (e.g. every edge
# publish) updates that same open PR instead of piling up new ones.
#
# Requires, under Settings -> Actions -> General -> Workflow permissions:
#   - "Read and write permissions"
#   - "Allow GitHub Actions to create and approve pull requests"

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick channel + destination folder
        id: meta
        run: |
          if [ "${{ github.event.release.tag_name }}" = "edge" ]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
            echo "dir=docs/firmware/edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "dir=docs/firmware/stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Download this release's full-image assets
        env:
          DEST: ${{ steps.meta.outputs.dir }}
        run: |
          mkdir -p "$DEST"
          echo '${{ toJson(github.event.release.assets) }}' > assets.json
          for chip in esp32c6 esp32s3; do
            url=$(jq -r --arg c "$chip" \
              '.[] | select(.name | contains($c) and endswith("-full.bin")) | .browser_download_url' \
              assets.json)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -fL -o "$DEST/${chip}-full.bin" "$url"
            else
              echo "::warning::No ${chip} full.bin asset found on this release"
            fi
          done
          echo "${{ github.event.release.tag_name }}" > "$DEST/VERSION"
          rm -f assets.json

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Mirror ${{ github.event.release.tag_name }} firmware for web flasher"
          branch: firmware-mirror/${{ steps.meta.outputs.channel }}
          title: "Mirror ${{ steps.meta.outputs.channel }} firmware: ${{ github.event.release.tag_name }}"
          body: |
            Auto-generated by `mirror-firmware.yml` after release
            [`${{ github.event.release.tag_name }}`](${{ github.event.release.html_url }})
            was published. Updates `${{ steps.meta.outputs.dir }}` for the
            browser flasher at `docs/flash.html`.
          add-paths: docs/firmware
          delete-branch: false
