/* ---- LETTERS RAIN ---- */
function Rain(){
 const COLS=20,ROWS=18,MAXE=12,wd=S.rm,base=[700,550,450,350,260][S.rf-1],fmin=Math.round(base*.6);

  g.mod=3+rnd(3)}

 g.up=dt=>{g.fa+=dt;while(g.run&&g.fa>=g.speed){g.fa-=g.speed;move()}
  if(g.run){g.modT-=dt;if(g.modT<=0){if(g.m){g.m=null}else{const p=place((c,r)=>onB(c,r)||(c===g.t.c&&r===g.t.r)||g.dis.some(x=>x.c===c&&x.r===r));g.mch=rnd(2)?'-':'/';g.m={c:p.c,r:p.r}}g.modT=mw()}}};
 g.k=b=>{const d={u:0,d:1,l:2,r:3}[b];if(d===undefined)return;const last=g.q.length?g.q[g.q.length-1]:g.dir;if(d===last||d===[1,0,3,2][last]||g.q.length>=2)return;g.q.push(d)};
 g.draw=()=>{if(vw){R(3,8,2,136,2);R(155,8,2,136,2)}if(hw){R(0,11,160,2,2);R(0,139,160,2,2)}
  g.dis.forEach(d=>T(d.ch.toUpperCase(),d.c*8,d.r*8,3));if(g.m)T(g.mch,g.m.c*8,g.m.r*8,2);T(g.tch.toUpperCase(),g.t.c*8,g.t.r*8,3);
  g.body.forEach((s,i)=>R(s[0]*8+1,s[1]*8+1,6,6,i?2:3));
  hud(wd?g.word.slice(0,g.blank).toUpperCase()+'_'+g.word.slice(g.blank+1).toUpperCase():g.tch.toUpperCase())};
 spawn();return g}
/* ---- TENNIS LETTERS ---- */
function Tennis(){
 const COLS=20,ROWS=18,hard=S.tm,size=S.tp,base=[450,350,280,220,170][S.tb-1],bmin=Math.round(base*.4);
 const g={run:1,sc:0,li:0,bx:10,by:9,dx:rnd(2)?1:-1,dy:1,px:(COLS-size)>>1,mv:0,bms:base,ps:110,fa:0,pa:0,hk:'2'+hard};
 const ramp=()=>{g.bms=Math.max(bmin,g.bms-6);g.ps=Math.max(50,g.ps-3)};
 function deflect(x){const c=(size-1)/2,sp=g.mv,cur=Math.sign(g.dx)||1;
  if(c===0||Math.abs((x-g.px-c)/c)<.25)return sp?sp*(sp===cur?2:1):cur;
  const o=(x-g.px-c)/c,m=Math.abs(o),side=o<0?-1:1,d=cl(side*(m<.7?1:2)+sp,-2,2);return d||side}
 function ball(){
  let nx=g.bx+g.dx,ny=g.by+g.dy,b=0;
  if(nx<1){nx=2-nx;g.dx=-g.dx;b=1}else if(nx>COLS-2){nx=2*(COLS-2)-nx;g.dx=-g.dx;b=1}
  if(ny<=1){g.dy=-g.dy;ramp();ny=g.by+g.dy;b=1}
  if(ny>=ROWS-1){
   if(nx>=g.px&&nx<g.px+size){g.dy=-g.dy;ny=g.by+g.dy;b=1;g.sc++;
    if(hard){g.dx=deflect(nx);nx=g.bx+g.dx;if(nx<1){nx=2-nx;g.dx=-g.dx}else if(nx>COLS-2){nx=2*(COLS-2)-nx;g.dx=-g.dx}}
    if(g.sc%26===0)ok();g.li=(g.li+1)%26
   }else{g.bx=nx;g.by=ny;fin(g.sc,g.sc>=26);return}}
  if(b)beep(800);g.bx=nx;g.by=ny}
 const step=d=>{g.mv=Math.sign(d);g.px=cl(g.px+d,1,COLS-1-size)};
 g.up=dt=>{g.fa+=dt;g.pa+=dt;while(g.run&&g.fa>=g.bms){g.fa-=g.bms;ball()}while(g.pa>=g.ps){g.pa-=g.ps;const d=(K.r?1:0)-(K.l?1:0);g.mv=d;if(d)step(d)}};
 g.k=b=>{if(b==='l'||b==='r'){step(b==='r'?1:-1);g.pa=0}};
 g.draw=()=>{wallsV();R(0,11,160,2,2);R(g.px*8,138,size*8,4);T(AZ[g.li].toUpperCase(),g.bx*8,g.by*8,3);hud()};
 return g}
/* ---- loop / render ---- */
function render(){
 pal=scr==='cover'?OR:PAL;R(0,0,160,144,0);
 if(scr==='cover')cover();
 else if(scr==='play'){M.draw();if(M.done)box([M.beat?'NEW BEST!':M.win?'YOU WIN!':'GAME OVER','SCORE '+M.sc,'BEST '+(HI[M.hk]||0),'','A:AGAIN B:MENU']);else if(paused)box(['PAUSED','','START:RESUME','B:QUIT'])}
 else menu()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(100,t-lt);lt=t;if(mt>0)mt-=dt;
 if(scr==='play'&&M.run&&!paused)M.up(dt);render()}
/* ---- input ---- */
const down=b=>{if(K[b])return;K[b]=1;press(b)},up=b=>{K[b]=0};
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',x:'a',z:'b',Enter:'st',' ':'st',Shift:'se',Backspace:'se'};
addEventListener('keydown',e=>{const b=KM[e.key]||KM[e.key.toLowerCase()];if(!b)return;e.preventDefault();down(b)});
addEventListener('keyup',e=>{const b=KM[e.key]||KM[e.key.toLowerCase()];if(b)up(b)});
addEventListener('blur',()=>{for(const k in K)K[k]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='play'&&M.run&&!M.done)paused=1});
document.querySelectorAll('[data-b]').forEach(el=>{const b=el.dataset.b;
 el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}down(b)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,()=>up(b)));
 el.addEventListener('contextmenu',e=>e.preventDefault())});
requestAnimationFrame(t=>{lt=t;loop(t)});
})();
